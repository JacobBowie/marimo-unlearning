name: lint + WASM build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: marimo check
    runs-on: ubuntu-latest
    steps:
      # Node-24 majors (checkout v7, setup-uv v10.3.0, upload-artifact v7), bumped
      # 2026-10-16 after GitHub deprecated the Node 20 runtime. setup-uv publishes
      # only full version tags (no moving v10), so it is pinned to the release.
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync env (locked)
        run: uv sync --locked
      - name: marimo check (main notebook)
        run: uv run marimo check notebook.py
      - name: marimo check (sketches, non-blocking)
        continue-on-error: true
        run: |
          uv run marimo check sketches/comparison.py
          uv run marimo check sketches/d3_force_skeleton.py

  wasm-build:
    name: WASM export
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # The real build script, not a copy of its export line: it also strips
      # marimo's assistant scaffold and injects the loading splash, and it
      # fails if a marimo upgrade moves the splash's #root anchor.
      - name: Build WASM bundle
        run: bash deploy/build_wasm.sh
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: unlearning-wasm
          path: dist/unlearning/
          retention-days: 30
