<!-- Loading splash, inserted right after <div id="root"></div> by
     deploy/build_wasm.sh. marimo's own "Loading marimo..." shows only for the
     first few seconds; after that the page stays blank until the cells paint
     (30 to 60 s on a first visit). This sits outside #root so React's mount
     cannot wipe it, removes itself once the notebook's first heading is
     visible (or after 120 s regardless), and never blocks clicks. -->
<div id="jb-splash" role="status" aria-live="polite">
  <div class="jb-splash-card">
    <div class="jb-splash-spinner" aria-hidden="true"></div>
    <p class="jb-splash-title">Loading the notebook…</p>
    <p class="jb-splash-body">The first visit takes 30 to 60 seconds while Python starts up inside your browser. After that it's fast.</p>
  </div>
</div>
<style>
  #jb-splash {
    position: fixed; inset: 0; z-index: 2147483000;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: #ffffff; pointer-events: none;
    transition: opacity 0.3s ease;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1f2937;
  }
  #jb-splash.jb-done { opacity: 0; }
  .jb-splash-card { max-width: 26rem; text-align: center; }
  .jb-splash-spinner {
    width: 36px; height: 36px; margin: 0 auto 16px;
    border: 3px solid #dbe4f0; border-top-color: #2563eb; border-radius: 50%;
    animation: jb-spin 1s linear infinite;
  }
  .jb-splash-title { font-size: 1.125rem; font-weight: 600; margin: 0 0 8px; }
  .jb-splash-body { font-size: 0.95rem; line-height: 1.5; margin: 0; color: #4b5563; }
  @keyframes jb-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .jb-splash-spinner { animation: none; } }
</style>
<script>
  (function () {
    var splash = document.getElementById("jb-splash");
    var started = Date.now();
    function painted() {
      var h = document.querySelector("#root h1");
      if (!h || h.offsetHeight === 0) return false;
      return h.checkVisibility
        ? h.checkVisibility({ opacityProperty: true, visibilityProperty: true })
        : true;
    }
    var timer = setInterval(function () {
      if (painted() || Date.now() - started > 120000) {
        clearInterval(timer);
        splash.classList.add("jb-done");
        setTimeout(function () { splash.remove(); }, 400);
      }
    }, 250);
  })();
</script>
